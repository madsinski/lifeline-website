<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#10B981"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F7FAF8"/>

  <!-- blocks -->
  <g filter="url(#sh)">
    <rect x="80" y="250" width="480" height="400" rx="30" fill="#fff"/>
    <rect x="1040" y="250" width="480" height="400" rx="30" fill="#fff"/>
  </g>
  <rect x="80" y="250" width="480" height="14" rx="7" fill="#2563EB"/>
  <rect x="1040" y="250" width="480" height="14" rx="7" fill="#10B981"/>
  <text x="120" y="330" font-size="34" font-weight="800" fill="#1E3A8A">Heilsugæslan</text>
  <text x="120" y="362" font-size="18" fill="#1D4ED8" font-weight="700">Greining og meðferð</text>
  <g font-size="20" fill="#334155"><text x="120" y="430">Blóðprufa sem fólk fengi</text><text x="120" y="458">hvort eð er</text><text x="120" y="510">Lyfjameðferð og eftirfylgd</text><text x="120" y="538">þegar vandi greinist</text><text x="120" y="590">Getur einbeitt sér að meðferð</text></g>

  <text x="1080" y="330" font-size="34" font-weight="800" fill="#0F2A23">Lifeline + Vera</text>
  <text x="1080" y="362" font-size="18" fill="#047857" font-weight="700">Lífsstíll og eftirfylgd</text>
  <g font-size="20" fill="#334155"><text x="1080" y="430">Svefn, hreyfing, næring</text><text x="1080" y="458">og andleg líðan</text><text x="1080" y="510">Viðtal og áætlun til 3 mánaða</text><text x="1080" y="562">Eftirfylgd og endurmat</text><text x="1080" y="590">eftir ár</text></g>

  <!-- top arrow: HG -> Lifeline -->
  <path d="M470 240 C620 90 980 90 1130 240" fill="none" stroke="#10B981" stroke-width="8" marker-end="url(#a1)"/>
  <rect x="560" y="80" width="480" height="92" rx="46" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  <text x="800" y="118" text-anchor="middle" font-size="22" font-weight="800" fill="#065F46">Heilsugæslan vísar í lífsstílsinngrip</text>
  <text x="800" y="148" text-anchor="middle" font-size="17" fill="#047857">og veit að sá hluti er í höndum Lifeline og Veru</text>

  <!-- bottom arrow: Lifeline -> HG -->
  <path d="M1130 660 C980 810 620 810 470 660" fill="none" stroke="#2563EB" stroke-width="8" marker-end="url(#a2)"/>
  <rect x="560" y="728" width="480" height="92" rx="46" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="800" y="766" text-anchor="middle" font-size="22" font-weight="800" fill="#1E3A8A">Heilsufarsvandi greinist</text>
  <text x="800" y="796" text-anchor="middle" font-size="17" fill="#1D4ED8">Lifeline vísar á Heilsugæsluna með niðurstöðum</text>

  <!-- centre -->
  <circle cx="800" cy="450" r="95" fill="#0F2A23"/>
  <text x="800" y="440" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Sami</text>
  <text x="800" y="468" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">einstaklingur</text>
  <text x="800" y="494" text-anchor="middle" font-size="14" fill="#A7F3D0">ekkert fellur á milli</text>
</svg>
