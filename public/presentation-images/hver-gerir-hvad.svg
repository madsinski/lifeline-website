<text x="1362.0" y="577" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Tekur við ef vandi</text><text x="1362.0" y="596" text-anchor="middle" font-size="13" fill="#1E3A8A">greinist (tilvísun)</text>
<rect x="928" y="712" width="128" height="56" rx="14" fill="#D97706"/>
<text x="992.0" y="746" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Mælingar</text>
<rect x="1224" y="712" width="276" height="56" rx="14" fill="#D97706"/>
<text x="1362.0" y="737" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Viðtal · áætlun</text><text x="1362.0" y="756" text-anchor="middle" font-size="13" fill="#fff">eftirfylgd eftir 3 mán.</text>
<text x="800" y="862" text-anchor="middle" font-size="16" fill="#64748B">Brotalína = til vara eða eftir þörfum. Hvert skref opnast sjálfkrafa þegar fyrra skrefi lýkur.</text>
