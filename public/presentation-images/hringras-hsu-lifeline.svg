<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="Hringrás þjónustunnar: íbúi kemur inn um heilsugæslu HSU eða beint hjá Lifeline. HSU vísar í heilsueflingu, Lifeline vísar læknisfræðilegum vandamálum aftur á heilsugæslu.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/><stop offset="55%" stop-color="#151a21"/><stop offset="100%" stop-color="#0d1116"/>
    </linearGradient>
    <radialGradient id="lift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA47A" stop-opacity=".10"/><stop offset="60%" stop-color="#0EA47A" stop-opacity="0"/><stop offset="100%" stop-color="#0EA47A" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrE" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#0EA47A"/>
    </marker>
    <marker id="arrS" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#8b98a6"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5d6b78"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="200" cy="-60" rx="900" ry="600" fill="url(#lift)"/>

  <g transform="translate(0,148)">

  <!-- entry points — hairline, square-cornered, mono label -->
  <g>
    <rect x="60" y="42" width="356" height="52" rx="4" fill="none" stroke="#3d4854" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="238" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, monospace" font-size="16" letter-spacing="1.4" fill="#c3ccd6" text-anchor="middle">KEMUR INN UM HEILSUGÆSLUNA</text>
    <path d="M 238 100 C 238 158, 330 178, 442 232" fill="none" stroke="#3d4854" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrD)"/>

    <rect x="1184" y="42" width="356" height="52" rx="4" fill="none" stroke="#3d4854" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1362" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, monospace" font-size="16" letter-spacing="1.4" fill="#c3ccd6" text-anchor="middle">SKRÁIR SIG BEINT HJÁ LIFELINE</text>
    <path d="M 1362 100 C 1362 158, 1270 178, 1158 232" fill="none" stroke="#3d4854" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrD)"/>
  </g>

  <!-- the loop: each arc is coloured by where it leads -->
  <path d="M 621 251 Q 800 143 979 251" fill="none" stroke="#0EA47A" stroke-width="2.5" marker-end="url(#arrE)"/>
  <text x="800" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, monospace" font-size="17" letter-spacing="2.1" fill="#4ADE9E" text-anchor="middle">TILVÍSUN Í HEILSUEFLINGU</text>

  <path d="M 979 409 Q 800 517 621 409" fill="none" stroke="#8b98a6" stroke-width="2.5" marker-end="url(#arrS)"/>
  <text x="800" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, monospace" font-size="17" letter-spacing="2.1" fill="#c3ccd6" text-anchor="middle">LÆKNISFRÆÐILEG VANDAMÁL VÍSAÐ AFTUR Á HEILSUGÆSLU</text>
  <text x="800" y="594" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#93a0ac" text-anchor="middle">Heilsugæslan fær heilbrigðara sjúkling til baka</text>

  <!-- nodes: hairline rings, so the loop stays the loudest thing on the slide -->
  <circle cx="540" cy="330" r="112" fill="#ffffff" fill-opacity=".035" stroke="#8b98a6" stroke-width="2"/>
  <text x="540" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#f2f5f7" text-anchor="middle">Heilsugæsla</text>
  <text x="540" y="362" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#c3ccd6" text-anchor="middle">HSU</text>

  <circle cx="1060" cy="330" r="112" fill="#0EA47A" fill-opacity=".07" stroke="#0EA47A" stroke-width="2"/>
  <text x="1060" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#f2f5f7" text-anchor="middle">Lifeline</text>
  <text x="1060" y="362" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#4ADE9E" text-anchor="middle">heilsuefling</text>

  <!-- what stays where -->
  <line x1="60" y1="228" x2="360" y2="228" stroke="#c3ccd6" stroke-opacity=".45" stroke-width="1"/>
    <text x="60" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, monospace" font-size="17" letter-spacing="1.9" fill="#c3ccd6">VERÐUR EFTIR HJÁ HSU</text>
    <text x="60" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Meðferð á læknisfræðilegum</text>
  <text x="60" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">vandamálum</text>
    <text x="60" y="368" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Lyfjameðferð</text>
    <text x="60" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Eftirlit langvinnra sjúkdóma</text>
    <text x="60" y="444" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Blóðrannsóknir og mælingar</text>
    <text x="60" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Bráð vandamál og veikindi</text>

    <line x1="1184" y1="228" x2="1484" y2="228" stroke="#4ADE9E" stroke-opacity=".45" stroke-width="1"/>
    <text x="1184" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, monospace" font-size="17" letter-spacing="1.9" fill="#4ADE9E">VERÐUR EFTIR HJÁ LIFELINE</text>
    <text x="1184" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Heilsufarsskoðun</text>
    <text x="1184" y="342" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Læknisviðtal og skýrsla</text>
    <text x="1184" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Lífsstílsáætlun</text>
    <text x="1184" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Eftirfylgd og hvatning</text>
    <text x="1184" y="456" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#93a0ac">Endurmat</text>
  </g>
</svg>
