<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="Hringrás þjónustunnar: íbúi kemur inn um heilsugæslu HSU eða beint hjá Lifeline. HSU vísar í heilsumat, Lifeline vísar aftur í hefðbundna þjónustu.">
  <defs>
    <style>
      .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .node { font-weight: 700; font-size: 34px; }
      .tag  { font-weight: 700; font-size: 20px; letter-spacing: .14em; }
      .col-h{ font-weight: 700; font-size: 22px; letter-spacing: .02em; }
      .li   { font-weight: 400; font-size: 20px; }
      .chip { font-weight: 600; font-size: 20px; }
    </style>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowE" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrE" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#10B981"/>
    </marker>
    <marker id="arrC" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#06B6D4"/>
    </marker>
    <marker id="arrM" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#7fb8ab"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#06231c"/>
  <ellipse cx="540" cy="355" rx="300" ry="260" fill="url(#glowC)"/>
  <ellipse cx="1060" cy="355" rx="300" ry="260" fill="url(#glowE)"/>

  <!-- entry points -->
  <g class="f">
    <rect x="60" y="44" width="356" height="56" rx="28" fill="none" stroke="#7fb8ab" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="238" y="80" class="chip" fill="#bfe7d8" text-anchor="middle">Kemur inn um heilsugæsluna</text>
    <path d="M 238 104 C 238 170, 330 190, 452 250" fill="none" stroke="#7fb8ab" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrM)"/>

    <rect x="1184" y="44" width="356" height="56" rx="28" fill="none" stroke="#7fb8ab" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1362" y="80" class="chip" fill="#bfe7d8" text-anchor="middle">Skráir sig beint hjá Lifeline</text>
    <path d="M 1362 104 C 1362 170, 1270 190, 1148 250" fill="none" stroke="#7fb8ab" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrM)"/>
  </g>

  <!-- the cycle -->
  <path d="M 600 251 Q 800 128 1000 251" fill="none" stroke="#06B6D4" stroke-width="4" marker-end="url(#arrC)"/>
  <path d="M 1000 459 Q 800 582 600 459" fill="none" stroke="#10B981" stroke-width="4" marker-end="url(#arrE)"/>

  <text x="800" y="104" class="f tag" fill="#67e8f9" text-anchor="middle">TILVÍSUN Í HEILSUMAT</text>
  <text x="800" y="628" class="f tag" fill="#6ee7b7" text-anchor="middle">VÍSAÐ AFTUR Í HEFÐBUNDNA ÞJÓNUSTU</text>

  <!-- nodes -->
  <circle cx="540" cy="355" r="120" fill="#07372b" stroke="#06B6D4" stroke-width="4"/>
  <text x="540" y="345" class="f node" fill="#eafaf3" text-anchor="middle">Heilsugæsla</text>
  <text x="540" y="388" class="f node" fill="#67e8f9" text-anchor="middle">HSU</text>

  <circle cx="1060" cy="355" r="120" fill="#07372b" stroke="#10B981" stroke-width="4"/>
  <text x="1060" y="345" class="f node" fill="#eafaf3" text-anchor="middle">Lifeline</text>
  <text x="1060" y="388" class="f node" fill="#6ee7b7" text-anchor="middle">heilsumat</text>

  <!-- what stays where -->
  <g class="f">
    <text x="60" y="248" class="col-h" fill="#67e8f9">Verður eftir hjá HSU</text>
    <text x="60" y="292" class="li" fill="#bfe7d8">Greining og meðferð</text>
    <text x="60" y="330" class="li" fill="#bfe7d8">Lyfjameðferð</text>
    <text x="60" y="368" class="li" fill="#bfe7d8">Eftirlit langvinnra sjúkdóma</text>
    <text x="60" y="406" class="li" fill="#bfe7d8">Blóðrannsóknir og mælingar</text>
    <text x="60" y="444" class="li" fill="#bfe7d8">Bráðaerindi</text>

    <text x="1184" y="248" class="col-h" fill="#6ee7b7">Verður eftir hjá Lifeline</text>
    <text x="1184" y="292" class="li" fill="#bfe7d8">Heilsumat læknis</text>
    <text x="1184" y="330" class="li" fill="#bfe7d8">Læknisviðtal og skýrsla</text>
    <text x="1184" y="368" class="li" fill="#bfe7d8">Lífsstílsáætlun</text>
    <text x="1184" y="406" class="li" fill="#bfe7d8">Eftirfylgd og hvatning</text>
    <text x="1184" y="444" class="li" fill="#bfe7d8">Endurmæling</text>
  </g>
</svg>
