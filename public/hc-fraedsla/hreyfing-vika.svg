<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" rx="28" fill="#FFF8F3"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#431407">Vikan þín: 150 mínútur og styrkur tvisvar</text>
  <text x="40" y="78" font-size="14" fill="#9A3412">Dæmi um hvernig ráðleggingar um hreyfingu geta raðast á vikuna</text>
  <line x1="80" y1="340" x2="860" y2="340" stroke="#FED7AA" stroke-width="2"/>
  <line x1="80" y1="220" x2="860" y2="220" stroke="#FDBA74" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="856" y="212" text-anchor="end" font-size="12" fill="#C2410C">30 mín.</text>
  <g font-size="14" text-anchor="middle" fill="#7C2D12">
    <rect x="110" y="220" width="64" height="120" rx="10" fill="#FB923C"/><text x="142" y="364">Mán</text><text x="142" y="210" font-weight="700">30</text>
    <rect x="220" y="280" width="64" height="60" rx="10" fill="#FDBA74"/><text x="252" y="364">Þri</text><text x="252" y="270" font-weight="700">15</text>
    <rect x="330" y="220" width="64" height="120" rx="10" fill="#FB923C"/><text x="362" y="364">Mið</text><text x="362" y="210" font-weight="700">30</text>
    <rect x="440" y="280" width="64" height="60" rx="10" fill="#FDBA74"/><text x="472" y="364">Fim</text><text x="472" y="270" font-weight="700">15</text>
    <rect x="550" y="220" width="64" height="120" rx="10" fill="#FB923C"/><text x="582" y="364">Fös</text><text x="582" y="210" font-weight="700">30</text>
    <rect x="660" y="220" width="64" height="120" rx="10" fill="#EA580C"/><text x="692" y="364">Lau</text><text x="692" y="210" font-weight="700">30</text>
    <rect x="770" y="330" width="64" height="10" rx="4" fill="#FED7AA"/><text x="802" y="364">Sun</text><text x="802" y="320" font-size="12">hvíld</text>
  </g>
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="114" y="226" width="56" height="22" rx="11" fill="#7C2D12"/><text x="142" y="241">STYRKUR</text>
    <rect x="554" y="226" width="56" height="22" rx="11" fill="#7C2D12"/><text x="582" y="241">STYRKUR</text>
  </g>
  <text x="40" y="404" font-size="15" fill="#7C2D12"><tspan font-weight="700">Samtals 150 mínútur</tspan> af rólegri til miðlungs ákefð. Rösk ganga telur. Byrjaðu smátt og bættu við.</text>
</svg>
