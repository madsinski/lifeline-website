<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="800" height="520" rx="28" fill="#F7FAF8"/>
  <text x="400" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#0F2A23">Fjórar stoðir heilsu</text>
  <text x="400" y="84" text-anchor="middle" font-size="16" fill="#4A5A54">Hver stoð styður við hinar þrjár</text>
