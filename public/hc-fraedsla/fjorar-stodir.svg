    <text x="568" y="182" font-size="22" font-weight="700" fill="#9A3412">Hreyfing</text>
    <text x="568" y="208" font-size="14" fill="#9A3412">Styrkur og þol</text>
  </g>
  <g>
    <rect x="80" y="360" width="250" height="120" rx="22" fill="#F4FAE9" stroke="#C8E39A" stroke-width="2"/>
