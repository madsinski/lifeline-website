<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" rx="28" fill="#1E1B3A"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#EDEBFA">Ein nótt: 4–5 svefnlotur</text>
  <text x="40" y="78" font-size="14" fill="#A9A4CF">Hver lota er um 90 mínútur. Djúpsvefn er mestur snemma nætur, draumsvefn undir morgun.</text>
  <g font-size="13" fill="#A9A4CF" text-anchor="end">
    <text x="150" y="134">Vaka</text><text x="150" y="184">Draumsvefn</text><text x="150" y="234">Léttur svefn</text><text x="150" y="284">Djúpsvefn</text>
  </g>
  <g stroke="#2E2A55" stroke-width="1">
    <line x1="165" y1="130" x2="860" y2="130"/><line x1="165" y1="180" x2="860" y2="180"/><line x1="165" y1="230" x2="860" y2="230"/><line x1="165" y1="280" x2="860" y2="280"/>
  </g>
  <path d="M170 130 V230 H200 V280 H270 V230 H300 V180 H325 V230 H360 V280 H410 V230 H445 V180 H485 V230 H520 V280 H540 V230 H585 V180 H640 V230 H680 V180 H750 V230 H775 V180 H835 V130 H855"
        fill="none" stroke="#8B85D6" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#6D5FD8" opacity=".35"><rect x="200" y="280" width="70" height="14" rx="4"/><rect x="360" y="280" width="50" height="14" rx="4"/><rect x="520" y="280" width="20" height="14" rx="4"/></g>
  <g fill="#F0ABFC" opacity=".5"><rect x="300" y="166" width="25" height="14" rx="4"/><rect x="445" y="166" width="40" height="14" rx="4"/><rect x="585" y="166" width="55" height="14" rx="4"/><rect x="680" y="166" width="70" height="14" rx="4"/><rect x="775" y="166" width="60" height="14" rx="4"/></g>
  <g font-size="13" fill="#A9A4CF" text-anchor="middle">
    <text x="170" y="320">23:00</text><text x="340" y="320">01:00</text><text x="510" y="320">03:00</text><text x="680" y="320">05:00</text><text x="850" y="320">07:00</text>
  </g>
  <rect x="40" y="350" width="820" height="62" rx="16" fill="#2A2650"/>
  <text x="62" y="378" font-size="15" font-weight="700" fill="#EDEBFA">Hvers vegna skiptir fastur fótaferðartími máli?</text>
  <text x="62" y="400" font-size="14" fill="#C9C5EA">Líkamsklukkan stillist af reglu. Sá sem styttir nóttina missir mest af draumsvefni, sem er undir morgun.</text>
</svg>
